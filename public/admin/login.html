<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | AI Admission Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1 class="login-title">Admin Dashboard</h1>
        <p class="login-sub">AI Admission Enquiry Management Portal</p>
      </div>

      <div class="alert-box alert-danger" id="loginAlert" style="display: none;">
        <span class="alert-msg" id="loginAlertText"></span>
      </div>

      <form class="login-form" id="loginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="adminPassword">Admin Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="adminPassword" 
              class="form-control" 
              placeholder="Enter password configured in .env" 
              required
              autofocus
            />
            <button type="button" class="btn-toggle-pw" id="togglePwBtn" title="Toggle password visibility">
              👁️
            </button>
          </div>
          <span class="form-hint">Protected against repeated wrong password attempts</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
          Sign In to Admin Panel
        </button>
      </form>

      <div class="login-footer">
        <a href="/" class="login-back-link">← Return to Voice Web Assistant</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('adminPassword');
    const toggleBtn = document.getElementById('togglePwBtn');
    const alertBox = document.getElementById('loginAlert');
    const alertText = document.getElementById('loginAlertText');
    const submitBtn = document.getElementById('loginSubmitBtn');

    toggleBtn.addEventListener('click', () => {
      const isPw = passwordInput.type === 'password';
      passwordInput.type = isPw ? 'text' : 'password';
      toggleBtn.textContent = isPw ? '🙈' : '👁️';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = data.redirectUrl || '/admin';
        } else {
          alertBox.style.display = 'flex';
          alertText.textContent = data.message || 'Login failed. Please check your credentials.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Admin Panel';
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        alertBox.style.display = 'flex';
        alertText.textContent = 'Network error. Please ensure server is running.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Admin Panel';
      }
    });
  </script>
</body>
</html>
